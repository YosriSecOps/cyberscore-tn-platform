services:
  # ═══════════════════════════════════════
  # DATABASE
  # ═══════════════════════════════════════
  postgres:
    image: postgres:16-alpine
    container_name: cyberscore-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - cyberscore-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ═══════════════════════════════════════
  # CACHE & MESSAGE QUEUE
  # ═══════════════════════════════════════
  redis:
    image: redis:7-alpine
    container_name: cyberscore-redis
    ports:
      - "6379:6379"
    networks:
      - cyberscore-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ═══════════════════════════════════════
  # LOCAL AI (Ollama)
  # ═══════════════════════════════════════
  ollama:
    image: ollama/ollama:latest
    container_name: cyberscore-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - cyberscore-net
    # Uncomment below for GPU support (NVIDIA)
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  # ═══════════════════════════════════════
  # SECURITY SCANNERS
  # ═══════════════════════════════════════
  owasp-zap:
    image: ghcr.io/zaproxy/zaproxy:stable
    container_name: cyberscore-zap
    command: >
      zap.sh -daemon -host 0.0.0.0 -port 8080
      -config api.disablekey=true
      -config api.addrs.addr.name=.*
      -config api.addrs.addr.regex=true
    ports:
      - "8080:8080"
    networks:
      - cyberscore-net

  nmap:
    image: instrumentisto/nmap:latest
    container_name: cyberscore-nmap
    entrypoint: ["tail", "-f", "/dev/null"]
    networks:
      - cyberscore-net

  nuclei:
    image: projectdiscovery/nuclei:latest
    container_name: cyberscore-nuclei
    entrypoint: ["tail", "-f", "/dev/null"]
    volumes:
      - nuclei_templates:/root/nuclei-templates
    networks:
      - cyberscore-net

  subfinder:
    image: projectdiscovery/subfinder:latest
    container_name: cyberscore-subfinder
    entrypoint: ["tail", "-f", "/dev/null"]
    networks:
      - cyberscore-net

  # ═══════════════════════════════════════
  # EMAIL (Dev only — MailHog)
  # ═══════════════════════════════════════
  mailhog:
    image: mailhog/mailhog:latest
    container_name: cyberscore-mailhog
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI
    networks:
      - cyberscore-net

  # ═══════════════════════════════════════
  # BACKEND (FastAPI)
  # ═══════════════════════════════════════
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cyberscore-api
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${DB_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      OLLAMA_URL: http://ollama:11434
      ZAP_URL: http://owasp-zap:8080
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ALGORITHM: ${JWT_ALGORITHM}
      JWT_EXPIRATION_MINUTES: ${JWT_EXPIRATION_MINUTES}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      ABUSEIPDB_API_KEY: ${ABUSEIPDB_API_KEY:-}
      VIRUSTOTAL_API_KEY: ${VIRUSTOTAL_API_KEY:-}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      DEBUG: ${DEBUG}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    networks:
      - cyberscore-net
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # ═══════════════════════════════════════
  # CELERY WORKER (Background Tasks)
  # ═══════════════════════════════════════
  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cyberscore-worker
    command: celery -A app.tasks.celery_app worker -l info -c 4
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${DB_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      OLLAMA_URL: http://ollama:11434
      ZAP_URL: http://owasp-zap:8080
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    volumes:
      - ./backend:/app
    networks:
      - cyberscore-net

  # ═══════════════════════════════════════
  # FRONTEND (Next.js)
  # ═══════════════════════════════════════
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cyberscore-frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_WS_URL: ws://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    networks:
      - cyberscore-net
    command: npm run dev

volumes:
  postgres_data:
  ollama_data:
  nuclei_templates:

networks:
  cyberscore-net:
    driver: bridge
